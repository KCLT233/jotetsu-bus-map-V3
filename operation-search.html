<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123b67">
<title>運用検索</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f3f6fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans JP",sans-serif}
header{background:#123b67;color:#fff;padding:18px 15px 16px}
.title{font-size:23px;font-weight:900}.sub{font-size:12px;opacity:.8;margin-top:3px}
.tabs{display:flex;gap:8px;margin-top:14px}
.tab{flex:1;border:0;border-radius:12px;padding:12px;background:#ffffff2b;color:#fff;font-size:16px;font-weight:900;cursor:pointer}
.tab.active{background:#fff;color:#123b67}
main{max-width:680px;margin:auto;padding:12px}
.searchbox{background:#fff;border:1px solid #dce3eb;border-radius:15px;padding:14px;box-shadow:0 2px 9px #00000008}
.field{margin-bottom:12px}label{display:block;font-size:12px;font-weight:900;color:#718096;margin-bottom:6px}
select,input{width:100%;height:49px;border:1px solid #c9d5e1;border-radius:11px;background:#fff;padding:0 12px;font-size:17px;color:#172033}
.searchbtn{width:100%;height:49px;border:0;border-radius:11px;background:#123b67;color:#fff;font-size:16px;font-weight:900;cursor:pointer}
.searchbtn:active,.tab:active{transform:scale(.99)}
.note{font-size:11px;color:#718096;text-align:center;line-height:1.5;margin-top:8px}
#results{display:none;margin-top:15px}#results.show{display:block}
.resulthead{display:flex;justify-content:space-between;align-items:end;margin:0 2px 8px}
.resulttitle{font-size:18px;font-weight:900}.resultcount{font-size:11px;color:#718096}
.card{background:#fff;border:1px solid #dce3eb;border-radius:12px;margin:8px 0;overflow:hidden}
.cardhead{width:100%;border:0;background:#fff;padding:13px;display:flex;justify-content:space-between;align-items:center;text-align:left;cursor:pointer;color:#245a8f}
.dial{font-size:18px;font-weight:900}.summary{font-size:12px;color:#718096;margin-top:3px}
.delta{font-size:11px;font-weight:900;color:#765400;white-space:nowrap}
.body{display:none;border-top:1px solid #e5eaf0;padding:10px 12px 12px}.card.open .body{display:block}
.next{background:#fff2c2;border:1px solid #e8cb69;border-radius:9px;padding:10px;margin-bottom:9px}
.nextlabel{font-size:11px;font-weight:900;color:#765400}.nextmain{font-size:14px;font-weight:900;margin-top:3px}
.op{display:grid;grid-template-columns:55px 85px 1fr;gap:7px;padding:9px 2px;border-top:1px dashed #e3e8ee;font-size:13px}
.time{font-weight:900;font-variant-numeric:tabular-nums}.route{font-weight:900;color:#315d8e}
.empty{background:#fff;border:1px solid #dce3eb;border-radius:12px;padding:27px 15px;text-align:center;color:#718096}
@media(max-width:430px){.op{grid-template-columns:52px 78px 1fr}}
</style>
</head>
<body class="locked">
<style>
#passwordGate{position:fixed;inset:0;z-index:99999;background:#123b67;display:flex;align-items:center;justify-content:center;padding:24px}
#passwordBox{width:min(420px,100%);background:white;border-radius:20px;padding:28px 22px;box-shadow:0 12px 40px #0004;text-align:center}
#passwordBox .lock{font-size:42px;margin-bottom:8px}
#passwordBox h2{margin:0 0 8px;color:#123b67;font-size:24px}
#passwordBox p{margin:0 0 18px;color:#718096;font-size:14px}
#sitePassword{width:100%;height:52px;border:1px solid #cbd6e2;border-radius:11px;font-size:22px;text-align:center;letter-spacing:.25em;padding:0 12px}
#passwordSubmit{width:100%;height:52px;margin-top:12px;border:0;border-radius:11px;background:#123b67;color:white;font-size:17px;font-weight:900}
#passwordError{height:22px;margin-top:8px;color:#d33;font-size:13px;font-weight:700}
body.locked{overflow:hidden}
</style>

<div id="passwordGate">
  <div id="passwordBox">
    <div class="lock">🔒</div>
    <h2>運用検索</h2>
    <p>利用するにはパスワードを入力してください</p>
    <input id="sitePassword" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="パスワード">
    <button id="passwordSubmit" type="button">開く</button>
    <div id="passwordError"></div>
  </div>
</div>

<header>
<div class="title">🚌 運用検索</div>

</header>
<main>

</div>
<div class="field">
<label>基準時刻</label>
<input id="base" type="time" value="15:00">
</div>
<div class="field">
<label>検索範囲</label>
<select id="range">
<option value="5">前後5分</option>
<option value="15" selected>前後15分</option>
<option value="30">前後30分</option>
</select>
</div>
<button id="searchBtn" class="searchbtn" type="button">🔎 検索</button>
<div class="note">基準時刻の前後5分・15分・30分以内の運用を近い順に表示します。秒は入力しません。</div>
</section>

<section id="results">
<div class="resulthead">
<div id="resultTitle" class="resulttitle">検索結果</div>
<div id="resultCount" class="resultcount"></div>
</div>
<div id="resultList"></div>
</section>
</main>


<script>
(function(){
  const gate=document.getElementById("passwordGate");
  const input=document.getElementById("sitePassword");
  const btn=document.getElementById("passwordSubmit");
  const err=document.getElementById("passwordError");
  const PASS="3110";
  function unlock(){
    if(input.value===PASS){
      gate.style.display="none";
      document.body.classList.remove("locked");
      input.value="";
    }else{
      err.textContent="パスワードが違います";
      input.value="";
      input.focus();
    }
  }
  btn.addEventListener("click",unlock);
  input.addEventListener("keydown",function(e){if(e.key==="Enter") unlock();});
  window.addEventListener("load",function(){input.focus();});
})();
</script>

const routeEl = document.getElementById("route");
const baseEl = document.getElementById("base");
const rangeEl = document.getElementById("range");
const searchBtn = document.getElementById("searchBtn");
const results = document.getElementById("results");

const resultCount = document.getElementById("resultCount");

function toSec(t) {
  const p = t.split(":").map(Number);
  return p[0] * 3600 + p[1] * 60 + (p[2] || 0);
}

function baseSec() {
  const p = (baseEl.value || "15:00").split(":").map(Number);
  return p[0] * 3600 + p[1] * 60;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function renderCard(x) {
  const next = x.d.ops[x.index + 1] || null;
  const rows = x.d.ops.map((o,i) => `
    <div class="op">
      <span class="time">${esc(o.time.slice(0,5))}</span>
      <span class="route">${esc(o.route)}</span>
      <span>→ ${esc(o.dest)}${i === x.index + 1 ? "　<b>次運用</b>" : ""}</span>
    </div>
  `).join("");

  return `
  <div class="card">
    <button class="cardhead" type="button">
      <div>
        <div class="dial">ダイヤ${x.d.dial}</div>
        <div class="summary">${esc(x.o.time.slice(0,5))}　${esc(x.o.route)} → ${esc(x.o.dest)}</div>
      </div>
      <div class="delta">±${x.diff}秒　›</div>
    </button>
    <div class="body">
      ${next ? `
      <div class="next">
        <div class="nextlabel">▶ 次運用</div>
        <div class="nextmain">${esc(next.time.slice(0,5))}　${esc(next.route)} → ${esc(next.dest)}</div>
      </div>` : ""}
      ${rows}
    </div>
  </div>`;
}

function bindCards() {
  resultList.querySelectorAll(".cardhead").forEach(btn => {
    btn.addEventListener("click", () => {
      const card = btn.closest(".card");
      card.classList.toggle("open");
      btn.querySelector(".delta").textContent =
        card.classList.contains("open") ? "閉じる　⌃" : btn.dataset.closed;
    });
    btn.dataset.closed = btn.querySelector(".delta").textContent;
  });
}

function search() {
  const selectedRoute = routeEl.value;
  const target = baseSec();
  const range = Number(rangeEl.value || 15);
  const hits = [];

  DATA[kind].forEach(d => {
    d.ops.forEach((o,index) => {
      if (selectedRoute && o.route !== selectedRoute) return;
      const diff = Math.abs(toSec(o.time) - target);
      if (diff <= range * 60) hits.push({d,o,index,diff});
    });
  });

  hits.sort((a,b) => a.diff - b.diff || toSec(a.o.time) - toSec(b.o.time));

  results.classList.add("show");
  resultTitle.textContent = selectedRoute ? selectedRoute + " の検索結果" : "検索結果";
  resultCount.textContent = (baseEl.value || "15:00") + " / 前後" + range + "分";

  if (!hits.length) {
    resultList.innerHTML = '<div class="empty">前後15分以内に該当する運用がありません。<br>路線または基準時刻を変更してください。</div>';
    return;
  }

  resultList.innerHTML = hits.map(renderCard).join("");
  bindCards();
  results.scrollIntoView({behavior:"smooth",block:"start"});
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    kind = btn.dataset.kind;
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === btn));
    results.classList.remove("show");
    resultList.innerHTML = "";
  });
});

searchBtn.addEventListener("click", search);
</script>
</body>
</html>
